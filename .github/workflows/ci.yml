name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install turbo
        run: npm install -g turbo

      - name: Install dependencies
        run: turbo install

      - name: Build
        run: turbo build

      - name: Test
        run: turbo test

      - name: Run Backend Tests
        run: cd backend && poetry install && poetry run pytest
